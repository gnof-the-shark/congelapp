name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build App (Unsigned Archive)
      run: |
        xcodebuild -project Congelo.xcodeproj \
                   -scheme Congelo \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO
      
    - name: Create Payload and Zip IPA
      run: |
        mkdir Payload
        cp -r build/Build/Products/Release-iphoneos/Congelo.app Payload/
        zip -r Congelo.ipa Payload/
        rm -rf Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: Congelo-IPA
        path: Congelo.ipa
